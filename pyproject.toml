[project]
name = "grounded-kb"
version = "0.3.0"
description = "Git-native knowledge base where every product fact rests on a verbatim quote or a code anchor, checked for any coding agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["knowledge-base", "requirements", "traceability", "ai-agents", "claude-code", "codex", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
dependencies = [
    "pathspec>=1.1.1",
    "pdfplumber>=0.11.11",
    "pydantic>=2.14.4",
    "python-docx>=1.2.0",
    "ruamel-yaml>=0.19.1",
    "tree-sitter>=0.27.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.29.2",
]

[project.urls]
Homepage = "https://github.com/mrashidramzan1996/grounded-kb"
Repository = "https://github.com/mrashidramzan1996/grounded-kb"
Issues = "https://github.com/mrashidramzan1996/grounded-kb/issues"

[project.scripts]
kb = "kb.cli:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
testpaths = ["tests"]
markers = ["slow: builds the wheel and installs it into a throwaway venv (runs in the full suite)"]
norecursedirs = ["fixtures", ".*", "__pycache__"]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
    "ruff==0.17.6",
]
