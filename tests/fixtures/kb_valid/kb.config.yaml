version: 1
teams:
  team-billing:
    git_team: '@acme/billing'
  team-platform:
    git_team: '@acme/platform'
  product-owners:
    git_team: '@acme/product'
  tech-leads:
    git_team: '@acme/tech-leads'
modules:
- id: MOD-billing
