kb-check:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    # Honours policy.mode in kb.config.yaml (warn-only until you switch it to enforce).
    - uvx --from {{install_spec}} kb check --base origin/{{base}}
