name: kb

on:
  pull_request:
  push:
    branches: [{{base}}]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # Both steps honour policy.mode in kb.config.yaml (warn-only until you switch it to enforce).
      - if: github.event_name == 'pull_request'
        run: uvx --from '{{install_spec}}' kb check --base origin/${{ github.base_ref }}
      - if: github.event_name == 'push'
        run: uvx --from '{{install_spec}}' kb check
