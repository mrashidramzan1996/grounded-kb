name: kb

on:
  pull_request:
  # a review submitted or dismissed re-runs the owner-approval check
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [{{base}}]

permissions:
  contents: read

# one run per PR (or branch) at a time: a review run and a push to the PR never post the comment out of order
concurrency:
  group: "kb-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

# Two jobs, so the approval gate never runs pull-request code:
#   kb-policy  checks approvals, schema, stale context and the decision guard. It installs no project dependency and
#              runs no project test, so a pull request cannot reach the token that reads the forge and posts the comment.
#   kb-claims  runs the project's tests (pull-request code) to verify claims. It has a read-only token, never posts,
#              and never reads the forge.

jobs:
  # Mark THIS job as the required status check (branch protection or a ruleset).
  kb-policy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # lets kb verify --comment post and update its PR comment
    env:
      # How CI installs kb: a pinned spec such as 'git+https://github.com/<owner>/grounded-kb@<tag>' (see kb/README.md).
      # While it is empty the check is skipped with a warning. This job needs uv/uvx only: no dependency install.
      KB_INSTALL_SPEC: '{{install_spec}}'
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The PR head, not GitHub's test-merge commit: the stale-context check needs the branch's real fork point.
          ref: ${{ github.event.pull_request.head.sha }}
          # kb does no authenticated git operation: leave no token in .git/config
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - if: env.KB_INSTALL_SPEC == ''
        run: 'echo "::warning::kb: set the install spec in .github/workflows/kb.yml — see kb/README.md"'
      # Honours policy.mode in kb.config.yaml (warn-only until you switch it to enforce).
      - if: env.KB_INSTALL_SPEC != '' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
        env:
          # The default token cannot read organisation team membership, so an approval by a member of an @org/team
          # approver does not count (missing_owner_approval). Either list the members under teams.<name>.members in
          # kb.config.yaml on the default branch, or use a token that can read teams (read:org; e.g. a GitHub App
          # token with Members: read), or set policy.unreadable_teams: defer to leave it to code-owner review.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from "$KB_INSTALL_SPEC" kb verify --base "origin/$BASE_REF" --skip-tests --comment --forge auto
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-policy
          path: |
            .kb/cache/status.json
            .kb/cache/verify.md
          include-hidden-files: true
          if-no-files-found: warn

  kb-claims:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KB_INSTALL_SPEC: '{{install_spec}}'
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - if: env.KB_INSTALL_SPEC == ''
        run: 'echo "::warning::kb: set the install spec in .github/workflows/kb.yml — see kb/README.md"'
      # install your project's test dependencies here (kb verify runs the tests that claims link to, with the project's own python)
      # No GITHUB_TOKEN and --forge none: this job runs pull-request code, so it never posts and never reads the forge.
      - if: env.KB_INSTALL_SPEC != '' && github.event_name == 'pull_request'
        run: uvx --from "$KB_INSTALL_SPEC" kb verify --base "origin/$BASE_REF" --forge none
      - if: env.KB_INSTALL_SPEC != '' && github.event_name == 'push'
        run: uvx --from "$KB_INSTALL_SPEC" kb verify --all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-verify
          path: |
            .kb/cache/status.json
            .kb/cache/verify.md
          include-hidden-files: true
          if-no-files-found: warn
