name: kb

on:
  pull_request:
  # a review submitted or dismissed re-runs the owner-approval check
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [{{base}}]

permissions:
  contents: read

# one run per PR (or branch) at a time: a review run and a push to the PR never post the comment out of order
concurrency:
  group: "kb-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

# The approval gate never runs pull-request code. kb-policy checks approvals, schema, stale context and the decision
# guard: it installs no project dependency, runs no project test, and uses no cache, uv config or uv version the pull
# request can influence, so a pull request cannot reach the token that reads the forge and posts the comment.
# The project's tests (pull-request code) run in .github/workflows/kb-claims.yml, with no token.

jobs:
  # Mark THIS job as the required status check (branch protection or a ruleset).
  kb-policy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # lets kb verify --comment post and update its PR comment
    env:
      # How CI installs kb: a pinned spec such as 'git+https://github.com/<owner>/grounded-kb@<tag>' (see kb/README.md).
      # While it is empty the check is skipped with a warning. This job needs uv/uvx only: no dependency install.
      KB_INSTALL_SPEC: '{{install_spec}}'
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The PR head, not GitHub's test-merge commit: the stale-context check needs the branch's real fork point.
          ref: ${{ github.event.pull_request.head.sha }}
          # kb does no authenticated git operation: leave no token in .git/config
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          # the uv cache and the uv version are not the pull request's to choose: kb-claims runs PR code that could
          # poison ~/.cache/uv, and setup-uv reads the version from the PR's pyproject.toml
          enable-cache: false
          version: "0.12.6"
      - if: env.KB_INSTALL_SPEC == ''
        run: 'echo "::warning::kb: set the install spec in .github/workflows/kb.yml — see kb/README.md"'
      # Honours policy.mode in kb.config.yaml (warn-only until you switch it to enforce).
      - if: env.KB_INSTALL_SPEC != '' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
        env:
          # The default token cannot read organisation team membership, so an approval by a member of an @org/team
          # approver does not count (missing_owner_approval). Either list the members under teams.<name>.members in
          # kb.config.yaml on the default branch, or use a token that can read teams (read:org; e.g. a GitHub App
          # token with Members: read), or set policy.unreadable_teams: defer to leave it to code-owner review.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # uv reads uv.toml and pyproject.toml of the working directory (hence the runner temp dir, not the checkout),
          # and its index, config and Python downloads would otherwise be configurable by the pull request
          UV_NO_CONFIG: "1"
          UV_INDEX_URL: https://pypi.org/simple
          UV_PYTHON_DOWNLOADS: never
        working-directory: ${{ runner.temp }}
        run: uvx --from "$KB_INSTALL_SPEC" kb -C "$GITHUB_WORKSPACE" verify --base "origin/$BASE_REF" --skip-tests --comment --forge auto
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-policy
          path: |
            .kb/cache/status.json
            .kb/cache/verify.md
          include-hidden-files: true
          if-no-files-found: warn
