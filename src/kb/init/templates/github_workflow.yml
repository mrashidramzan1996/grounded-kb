name: kb

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # Honours policy.mode in kb.config.yaml (warn-only until you switch it to enforce).
      - run: uvx --from {{install_spec}} kb check --base origin/{{base}}
